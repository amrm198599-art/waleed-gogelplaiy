name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Extract Project Zip
        run: |
          ZIP=$(ls PlayCheck*.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "Error: PlayCheck zip not found in repo root!"; ls -la; exit 1; fi
          echo "Using $ZIP"
          unzip -q "$ZIP" -d extracted_project
          PROJECT_DIR=$(dirname "$(find extracted_project -maxdepth 3 -name settings.gradle.kts | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then echo "Error: project not found"; exit 1; fi
          echo "PROJECT_PATH=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Prepare signing (optional, needs repo secrets)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/upload-key.jks"
          cat > "$PROJECT_PATH/keystore.properties" <<PROPS
          storeFile=$GITHUB_WORKSPACE/upload-key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          sed -i 's/^ *//' "$PROJECT_PATH/keystore.properties"

      - name: Lint + build debug APK and AAB
        working-directory: ${{ env.PROJECT_PATH }}
        run: gradle lintDebug assembleDebug bundleDebug --stacktrace

      - name: Build signed release APK and AAB (verifies keystore first)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: ${{ env.PROJECT_PATH }}
        run: gradle assembleRelease bundleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-debug
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/apk/debug/*.apk

      - name: Upload debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-aab-debug
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/bundle/debug/*.aab

      - name: Upload release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-release
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-aab-release
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/bundle/release/*.aab

      - name: Upload Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: ${{ env.PROJECT_PATH }}/app/build/reports/lint-results-debug.*
