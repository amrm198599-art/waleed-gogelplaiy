name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # إذا كان مشروعك مضغوطاً بصيغة zip داخل المستودع، فك ضغطه هكذا (عدل اسم الملف إذا لزم الأمر)
      - name: Extract Project Zip (If compressed)
        run: |
          if [ -f "PlayCheck.zip" ]; then
            unzip PlayCheck.zip -d .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: |
          cd PlayCheck # اسم المجلد الناتج بعد فك الضغط (حسب بنية مشروعك)
          chmod +x gradlew

      - name: Build APK and AAB with Gradle
        run: |
          cd PlayCheck
          # بناء ملف APK (Debug أو Release)
          ./gradlew assembleDebug
          # بناء ملف AAB (App Bundle) للنشر على متجر جوجل
          ./gradlew bundleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: PlayCheck/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: PlayCheck/app/build/outputs/bundle/debug/app-debug.aab
