name: Build Android App Automatically

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Project Zip & Setup Environment
        run: |
          echo "Current directory files:"
          ls -la
          
          # فك ضغط ملف الـ zip (تأكد أن اسم الملف المطابق هو PlayCheck.zip)
          if [ -f "PlayCheck.zip" ]; then
            unzip PlayCheck.zip -d extracted_project
          else
            echo "Error: PlayCheck.zip not found!"
            exit 1
          fi
          
          # البحث عن المجلد الناتج وضبط الصلاحيات
          cd extracted_project
          # إذا كان الملف المضغوط يفك داخل مجلد فرعي، سنجد مجلد المشروع داخله
          PROJECT_DIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: gradlew not found in extracted files!"
            exit 1
          fi
          
          cd "$PROJECT_DIR"
          echo "Project directory is: $(pwd)"
          chmod +x gradlew
          
          # حفظ مسار المشروع للاستخدام في الخطوات القادمة
          echo "PROJECT_PATH=extracted_project/$PROJECT_DIR" >> $GITHUB_ENV

      - name: Build APK and AAB with Gradle
        run: |
          cd ${{ env.PROJECT_PATH }}
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: ${{ env.PROJECT_PATH }}/app/build/outputs/bundle/debug/*.aab
